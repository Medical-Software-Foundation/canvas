<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oura Ring connection</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #f5f6f8; color: #1d2330; }
  main { max-width: 420px; margin: 0 auto; padding: 48px 20px; }
  .card { background: #fff; border-radius: 14px; padding: 28px 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { margin: 0; color: #3b4253; }
  @media (prefers-color-scheme: dark) {
    body { background: #14171d; color: #e8eaf0; }
    .card { background: #1d2129; box-shadow: none; }
    p { color: #c4c9d4; }
  }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Oura Ring connection</h1>
    <p>{{ message }}</p>
  </div>
</main>
</body>
</html>
