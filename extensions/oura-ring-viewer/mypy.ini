[mypy]
explicit_package_bases = True

check_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = False
disallow_untyped_defs = True
error_summary = True

show_error_context = True
strict_equality = True
strict_optional = True

warn_no_return = True
warn_redundant_casts = True
warn_return_any = True
warn_unreachable = True
warn_unused_configs = True
warn_unused_ignores = True

# canvas_sdk ships without type stubs or a py.typed marker.
follow_imports = silent
ignore_missing_imports = True
no_implicit_optional = True
pretty = False

python_version = 3.12

# Django ORM field declarations need the django-stubs plugin to infer types.
# Rather than wire that plugin into the SDK's bundled settings, strictness is
# scoped down for the models package, which only declares field shapes. The
# sync tests exercise these models end to end against a real database.
[mypy-oura_ring_viewer.models.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
warn_return_any = False
disable_error_code = var-annotated

# storage.py wraps ORM calls (.filter, .first, update_or_create) that return
# Any without django-stubs. The sync tests pin down the runtime types.
[mypy-oura_ring_viewer.services.storage]
warn_return_any = False
