<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Patient Vitals Trends</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <header>
        <div class="controls">
            <div class="control-group" id="graph1Ctrl">
                <label for="vitalSelect1">Metric #1</label>
                <select id="vitalSelect1"></select>
            </div>
            <button id="addGraphBtn" class="btn">Compare Metrics</button>
            <button id="historyToggleBtn" class="btn btn-secondary" aria-expanded="false" aria-controls="historyPanel">Show History</button>
            <div class="control-group" id="graph2Ctrl" style="display:none;">
                <label for="vitalSelect2">Metric #2</label>
                <select id="vitalSelect2"></select>
                <button id="removeGraphBtn" class="btn-icon" aria-label="Remove Chart">&times;</button>
            </div>
        </div>
    </header>

    <div class="chart-container">
        <div class="chart-wrapper">
            <canvas id="vitalsChart1"></canvas>
        </div>
        <div id="chart2Wrapper" class="chart-wrapper" style="display:none;">
            <canvas id="vitalsChart2"></canvas>
        </div>
    </div>

    <section id="historyPanel" class="history-panel" hidden>
        <h3 class="history-title">Recent Vitals History</h3>
        <div class="vitals-table-container">
            <table class="vitals-table" id="vitalsTable">
                <thead><tr id="vitalsTableHead"></tr></thead>
                <tbody id="vitalsTableBody"></tbody>
            </table>
        </div>
        <p id="historyEmpty" class="history-empty" hidden>No vitals recorded for this patient.</p>
    </section>

    <script>
        const dates = {{ dates|safe }};
        const vitalsData = {{ data|safe }};
        const yAxisRanges = {{ graph_ranges|safe }};

        const select1 = document.getElementById('vitalSelect1');
        const select2 = document.getElementById('vitalSelect2');
        const addBtn = document.getElementById('addGraphBtn');
        const removeBtn = document.getElementById('removeGraphBtn');
        const graph2Ctrl = document.getElementById('graph2Ctrl');
        const chart2Wrapper = document.getElementById('chart2Wrapper');

        Object.keys(vitalsData).forEach(key => select1.add(new Option(key, key)));

        function createChart(ctx, color = 'rgba(0,140,255,1)') {
            return new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [{
                        label: '',
                        data: [],
                        tension: 0.4,
                        cubicInterpolationMode: 'monotone',
                        pointRadius: 6,
                        pointHoverRadius: 10,
                        pointBackgroundColor: color,
                        pointBorderColor: '#ffffff',
                        pointBorderWidth: 2,
                        pointHoverBackgroundColor: color,
                        pointHoverBorderColor: '#ffffff',
                        pointHoverBorderWidth: 3,
                        borderWidth: 3,
                        borderColor: color,
                        fill: false,
                        spanGaps: true
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    animation: { duration: 800, easing: 'easeOutQuad' },
                    interaction: { intersect: false, mode: 'index' },
                    plugins: {
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            titleColor: '#ffffff',
                            bodyColor: '#ffffff',
                            borderColor: color,
                            borderWidth: 1,
                            cornerRadius: 6,
                            displayColors: false
                        },
                        legend: { display: false }
                    },
                    scales: {
                        x: { title: { display: true, text: 'Date' }, grid: { color: 'rgba(0, 0, 0, 0.06)' } },
                        y: { title: { display: true, text: '' }, grid: { color: 'rgba(0, 0, 0, 0.06)' } }
                    }
                }
            });
        }

        function hasValue(val) {
            return val !== null && val !== undefined && val !== '';
        }

        const chart1 = createChart(document.getElementById('vitalsChart1').getContext('2d'));
        let chart2;

        function updateChart(chart, vital) {
            // Drop readings with no value for this metric so the x-axis only
            // shows dates where the metric was actually recorded.
            const values = vitalsData[vital] || [];
            let chartData = [];
            let chartLabels = [];
            values.forEach((val, i) => {
                if (hasValue(val)) {
                    chartData.push(val);
                    chartLabels.push(dates[i]);
                }
            });
            // A single point would sit on the left edge; pad it to the centre.
            if (chartData.length === 1) {
                chartData = [null, chartData[0], null];
                chartLabels = ['', chartLabels[0], ''];
            }
            chart.data.labels = chartLabels;
            chart.data.datasets[0].data = chartData;
            chart.data.datasets[0].label = vital;
            chart.options.scales.y.title.text = vital;
            // Optional y-axis min and max values
            // if (yAxisRanges[vital]) {
            //     chart.options.scales.y.min = yAxisRanges[vital].min;
            //     chart.options.scales.y.max = yAxisRanges[vital].max;
            // } else {
            //     chart.options.scales.y.min = undefined;
            //     chart.options.scales.y.max = undefined;
            // }
            chart.update();
        }

        function filterSelect2() {
            const val1 = select1.value;
            select2.options.length = 0;
            Object.keys(vitalsData).forEach(key => {
                if (key !== val1) select2.add(new Option(key, key));
            });
        }

        select1.addEventListener('change', () => {
            updateChart(chart1, select1.value);
            if (chart2) filterSelect2();
        });

        addBtn.addEventListener('click', () => {
            addBtn.style.display = 'none';
            graph2Ctrl.style.display = 'flex';
            chart2Wrapper.style.display = 'flex';
            filterSelect2();
            chart2 = createChart(document.getElementById('vitalsChart2').getContext('2d'), 'rgba(255,99,132,1)');
            if (select2.options.length > 0) {
                select2.selectedIndex = 0;
                updateChart(chart2, select2.value);
            }
            select2.addEventListener('change', () => updateChart(chart2, select2.value));
        });

        removeBtn.addEventListener('click', () => {
            graph2Ctrl.style.display = 'none';
            chart2Wrapper.style.display = 'none';
            chart2.destroy(); chart2 = null;
            addBtn.style.display = 'inline-block';
        });

        const HISTORY_LIMIT = 10;
        const historyToggleBtn = document.getElementById('historyToggleBtn');
        const historyPanel = document.getElementById('historyPanel');

        function formatCell(val) {
            if (!hasValue(val)) return '\u2014';
            if (typeof val === 'number') return String(Math.round(val * 10) / 10);
            return String(val);
        }

        function buildHistoryTable() {
            // Most recent HISTORY_LIMIT readings, newest first.
            const start = Math.max(0, dates.length - HISTORY_LIMIT);
            const rows = [];
            for (let i = dates.length - 1; i >= start; i--) rows.push(i);
            // Only show metrics with at least one value in that window.
            const metrics = Object.keys(vitalsData).filter(
                key => rows.some(i => hasValue(vitalsData[key][i]))
            );

            if (!rows.length || !metrics.length) {
                document.getElementById('vitalsTable').hidden = true;
                document.getElementById('historyEmpty').hidden = false;
                return;
            }

            const head = document.getElementById('vitalsTableHead');
            ['Date', ...metrics].forEach(label => {
                const th = document.createElement('th');
                th.scope = 'col';
                th.textContent = label;
                head.appendChild(th);
            });

            const body = document.getElementById('vitalsTableBody');
            rows.forEach(i => {
                const tr = document.createElement('tr');
                const th = document.createElement('th');
                th.scope = 'row';
                th.textContent = dates[i];
                tr.appendChild(th);
                metrics.forEach(key => {
                    const td = document.createElement('td');
                    td.textContent = formatCell(vitalsData[key][i]);
                    tr.appendChild(td);
                });
                body.appendChild(tr);
            });
        }

        historyToggleBtn.addEventListener('click', () => {
            const show = historyPanel.hidden;
            historyPanel.hidden = !show;
            document.body.classList.toggle('history-open', show);
            historyToggleBtn.textContent = show ? 'Hide History' : 'Show History';
            historyToggleBtn.setAttribute('aria-expanded', String(show));
            // Charts resize to the smaller area when the panel opens.
            chart1.resize();
            if (chart2) chart2.resize();
        });

        buildHistoryTable();
        select1.selectedIndex = 0;
        updateChart(chart1, select1.value);
    </script>
</body>

</html>
