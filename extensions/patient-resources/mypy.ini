[mypy]
explicit_package_bases = True

check_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = False
disallow_untyped_defs = True
error_summary = True

show_error_context = True
strict_equality = True
strict_optional = True

warn_no_return = True
warn_redundant_casts = True
warn_return_any = True
warn_unreachable = True
warn_unused_configs = True
warn_unused_ignores = True

follow_imports = silent
no_implicit_optional = True
pretty = False

python_version = 3.12

# The tests deliberately fabricate canvas_sdk in sys.modules so the suite runs
# without the SDK installed (see tests/conftest.py). Type checking is the one
# place that must see the real SDK, so canvas is a dev dependency and
# ignore_missing_imports stays off globally -- an unresolved SDK import here
# means the plugin is importing something that does not exist.
ignore_missing_imports = False

# canvas_sdk ships no py.typed marker, so mypy cannot read its annotations even
# when it is installed. Resolving those imports as Any is the most that is
# available: it cannot verify SDK call signatures, but it does stop an
# unresolved import from suppressing every other check in the importing file,
# which is what made this type check vacuous before.
follow_untyped_imports = True

# Injected into the plugin sandbox by the Canvas runtime rather than shipped as
# an importable package, so there is nothing on disk for mypy to resolve.
[mypy-logger.*]
ignore_missing_imports = True

# Django model fields are descriptors: `note = TextField()` reads as a str at
# runtime but as a TextField to mypy. django-stubs normally bridges that, but its
# plugin does not recognise the SDK's CustomModel metaclass, so field
# declarations are exempted here rather than annotated with the wrong type.
[mypy-patient_resources.models.*]
disable_error_code = var-annotated

# Each proxy inherits from an SDK data model and from ModelExtension, and both
# declare a Meta. That is the SDK's documented way to extend a core model, so the
# conflict mypy reports is in the base classes rather than in this code.
[mypy-patient_resources.models.proxies]
disable_error_code = var-annotated, misc

# StaffSessionAuthMixin overrides SimpleAPIBase.authenticate with a narrower
# signature. That is the SDK's own inheritance shape -- the mixin exists to be
# combined with SimpleAPI exactly like this -- and tests/test_stub_contract.py
# checks the real mixin is what gets imported.
[mypy-patient_resources.routes.*]
disable_error_code = misc

# The suite fabricates canvas_sdk and Django in sys.modules and drives the plugin
# with MagicMock, so the errors below are properties of the test design rather
# than defects: attributes assigned onto synthesized ModuleType objects
# (attr-defined), doubles standing in for real signatures (arg-type),
# `Response | Effect` results being indexed (union-attr, index), and abstract SDK
# bases being instantiated directly (type-abstract, abstract), None standing in for an
# Event on a handler the test drives by hand (assignment), and a deliberate write to a
# frozen dataclass that asserts it is refused (misc).
#
# Kept as a named list rather than excluding tests/ altogether, so a genuine
# type error in a test that does not fall into these categories still surfaces.
[mypy-tests.*]
disallow_untyped_defs = False
disallow_untyped_calls = False
disable_error_code = attr-defined, union-attr, type-abstract, abstract, arg-type, index,
    comparison-overlap, var-annotated, return-value, no-untyped-def, assignment, misc
