<!--
  The chart picker. Loads the same stylesheet as the library so the two staff
  surfaces stay visually consistent, but its own script: this page only reads
  and shares, it cannot curate.
-->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Share resources</title>
<link rel="stylesheet" href="{{ asset_base }}/library.css?v={{ cache_bust }}" />

<div id="pr-app">
  <header class="pr-header">
    <div class="pr-header-main">
      <h1>Share resources</h1>
    </div>
    <div class="pr-header-actions">
      <button type="button" id="pr-close" class="pr-close" aria-label="Close">&times;</button>
    </div>
  </header>

  <span class="pr-field-label">Patient</span>
  <div class="pr-patient-card">
    <span class="pr-patient-name" id="pr-patient-name">Loading&hellip;</span>
    <span class="pr-patient-meta" id="pr-patient-meta"></span>
  </div>

  <span class="pr-field-label" id="pr-choose-label">Choose resources (searchable)</span>

  <div class="pr-controls">
    <label class="pr-visually-hidden" for="pr-search">Search resources</label>
    <input type="search" id="pr-search" placeholder="Search resources&hellip;" autocomplete="off" />
  </div>

  <ul class="pr-list" id="pr-list"></ul>
  <div class="pr-empty" id="pr-empty" hidden></div>
  <p class="pr-error" id="pr-error" role="alert"></p>

  <!-- The library is paged here too. Without this the picker showed the
       server's default first 50 rows and, unlike the library, printed no total
       -- so past fifty resources a provider could not reach the rest and was
       not told anything was missing. -->
  <nav class="pr-pager" id="pr-pager" aria-label="Resource pages" hidden>
    <span class="pr-range" id="pr-range" role="status" aria-live="polite"></span>
    <div class="pr-pager-buttons">
      <button type="button" id="pr-prev">Previous</button>
      <button type="button" id="pr-next">Next</button>
    </div>
  </nav>

  <div class="pr-footer">
    <!-- Selection survives a page change, so it can outlive what is on screen.
         The design drops the visible counter, which was fine while everything
         selected was also rendered; a resource selected on another page would
         otherwise go out unannounced. -->
    <span class="pr-offscreen-note" id="pr-offscreen" hidden></span>
    <!-- The design shows no selection counter, but the count is still worth
         announcing, so the live region stays and is only visually hidden. -->
    <span class="pr-visually-hidden" id="pr-selection" role="status" aria-live="polite"></span>
    <button type="button" id="pr-send" class="pr-primary" disabled>Send to patient portal</button>
  </div>
</div>

<!-- The confirmation for a send that closes the window behind it. Positioned
     over the page rather than in it, so it neither moves the list nor changes
     the height this page asks the host for. -->
<div class="pr-toast" id="pr-toast" role="status" aria-live="polite" hidden></div>

<dialog id="pr-result-dialog">
  <form method="dialog">
    <div class="pr-dialog-body">
      <h2>Sent</h2>
      <p id="pr-result-message"></p>
    </div>
    <div class="pr-dialog-actions">
      <button type="submit" class="pr-primary">Done</button>
    </div>
  </form>
</dialog>

<script id="pr-config" type="application/json">{{ config_json|safe }}</script>
<script src="{{ asset_base }}/picker.js?v={{ cache_bust }}" defer></script>
