# Local development and testing only. The Canvas plugin has its own packaging
# process that does not use this file.
[project]
name = "patient-resources"
version = "0.1.7"
description = "Admin-curated library of patient-facing resource links, shared to the patient portal"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    # Type checking only. The test suite fabricates canvas_sdk in sys.modules
    # (tests/conftest.py) and does not need this installed, but mypy does --
    # without it every SDK call is untyped and the type check is vacuous.
    "canvas>=0.200.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"

[tool.coverage.run]
# branch = true is deliberate. The repo's review gate is >=90% BRANCH coverage,
# but almost every plugin here omits this flag and so silently reports statement
# coverage instead. Without it the gate does not measure what it claims to.
branch = true
source = ["patient_resources"]
omit = ["tests/*", "*/tests/*", "*/__pycache__/*", ".venv/*"]

[tool.coverage.report]
omit = ["tests/*", "*/tests/*"]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
