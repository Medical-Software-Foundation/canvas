<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root {
  --bg: #f8f9fb;
  --surface: #fff;
  --border: #e2e5ea;
  --border-light: #f0f1f4;
  --text: #1a1d23;
  --text-secondary: #5f6876;
  --text-muted: #99a1ad;
  --primary: #2563eb;
  --primary-hover: #1d4fd8;
  --success: #0f8a5f;
  --success-hover: #0b7a52;
  --success-bg: #ecfdf3;
  --danger: #dc2626;
  --danger-bg: #fef2f2;
  --row-hover: #f5f7fa;
  --row-alt: #fafbfc;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --radius: 6px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 13px;
  color: var(--text);
  background: var(--bg);
  line-height: 1.5;
}
.page { max-width: 1100px; margin: 0 auto; padding: 28px 24px; }
.page-title {
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 20px;
  letter-spacing: -0.01em;
}
.page-title span { color: var(--text-muted); font-weight: 400; font-size: 13px; margin-left: 8px; }

/* Filter bar */
.filters {
  display: flex;
  align-items: flex-end;
  gap: 12px;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.filter-group { display: flex; flex-direction: column; gap: 4px; }
.filter-group label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
}
.filter-group input, .filter-group select {
  height: 34px;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  color: var(--text);
  background: var(--surface);
  outline: none;
}
.filter-group input:focus, .filter-group select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px rgba(37,99,235,0.12);
}
.filter-group select { min-width: 180px; }

/* Provider multi-select combobox */
.combobox { position: relative; min-width: 260px; }
.combobox-control {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  min-height: 34px;
  padding: 3px 28px 3px 6px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  cursor: text;
}
.combobox-control:focus-within {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px rgba(37,99,235,0.12);
}
.combobox-control input[type="text"] {
  flex: 1;
  min-width: 100px;
  border: none;
  outline: none;
  height: 26px;
  padding: 0 4px;
  font-size: 13px;
  color: var(--text);
  background: transparent;
}
.combobox-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 24px;
  padding: 0 4px 0 8px;
  border-radius: 4px;
  background: #eef2ff;
  color: #3730a3;
  font-size: 12px;
  font-weight: 500;
}
.combobox-chip button {
  border: none;
  background: transparent;
  color: #6366f1;
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  padding: 2px 4px;
  border-radius: 2px;
}
.combobox-chip button:hover { background: rgba(99,102,241,0.15); }
.combobox .clear-btn {
  position: absolute;
  right: 6px;
  top: 6px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
  padding: 4px;
  display: none;
}
.combobox.has-value .clear-btn { display: block; }
.combobox-options {
  position: absolute;
  top: calc(100% + 2px);
  left: 0;
  right: 0;
  max-height: 260px;
  overflow-y: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  list-style: none;
  z-index: 100;
  margin: 0;
  padding: 4px 0;
}
.combobox-options[hidden] { display: none; }
.combobox-options li {
  padding: 7px 12px;
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
}
.combobox-options li:hover,
.combobox-options li.active { background: var(--row-hover); }
.combobox-options li.empty {
  color: var(--text-muted);
  cursor: default;
  font-style: italic;
}
.combobox-options li.selected { color: var(--text-muted); }
.combobox-options li.selected::before { content: "✓ "; color: var(--success); }
.btn {
  height: 34px;
  padding: 0 16px;
  border: none;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background 0.15s, opacity 0.15s;
  white-space: nowrap;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-load { background: var(--text); color: #fff; }
.btn-load:hover:not(:disabled) { background: #2d3140; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover:not(:disabled) { background: var(--success-hover); }

/* Table */
.table-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
table { width: 100%; border-collapse: collapse; }
thead th {
  text-align: left;
  padding: 10px 14px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  user-select: none;
}
thead th:first-child { width: 40px; text-align: center; }
tbody tr { border-bottom: 1px solid var(--border-light); }
tbody tr:nth-child(even) { background: var(--row-alt); }
tbody tr:hover { background: var(--row-hover); }
tbody td { padding: 10px 14px; color: var(--text); }
tbody td:first-child { text-align: center; }
input[type="checkbox"] {
  width: 15px; height: 15px; cursor: pointer;
  accent-color: var(--primary);
}
.empty-state {
  padding: 48px 20px;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
}
.loading-state {
  padding: 48px 20px;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
}

/* Actions bar */
.actions-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 var(--radius) var(--radius);
}
.actions-left { font-size: 12px; color: var(--text-muted); }
.actions-right { display: flex; gap: 8px; }

/* Toast */
.toast {
  position: fixed;
  top: 16px;
  right: 16px;
  padding: 10px 16px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  box-shadow: var(--shadow);
  z-index: 1000;
  display: none;
  max-width: 400px;
}
.toast.visible { display: block; animation: slideIn 0.2s ease-out; }
.toast.success { background: var(--success-bg); color: var(--success); border: 1px solid #a7f3d0; }
.toast.error { background: var(--danger-bg); color: var(--danger); border: 1px solid #fca5a5; }
@keyframes slideIn { from { transform: translateY(-8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
</style>
</head>
<body>

<span id="providers-data" hidden>{{ providers_json }}</span>

<div id="toast" class="toast"></div>

<div class="page">
  <div class="page-title">Surescripts Requests <span>Bulk eligibility and medication history</span></div>

  <div class="filters">
    <div class="filter-group">
      <label>From</label>
      <input type="date" id="dateFrom">
    </div>
    <div class="filter-group">
      <label>To</label>
      <input type="date" id="dateTo">
    </div>
    <div class="filter-group">
      <label>Providers</label>
      <div class="combobox" id="providerCombo">
        <div class="combobox-control" id="providerControl">
          <input
            type="text"
            id="providerSearch"
            placeholder="All providers — type to search"
            autocomplete="off"
            aria-autocomplete="list"
            aria-controls="providerOptions"
          >
        </div>
        <button type="button" class="clear-btn" id="providerClear" aria-label="Clear all selected providers">×</button>
        <input type="hidden" id="providerFilter" value="">
        <ul class="combobox-options" id="providerOptions" hidden role="listbox"></ul>
      </div>
    </div>
    <button class="btn btn-load" id="loadBtn" type="button">Load Appointments</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th><input type="checkbox" id="selectAll"></th>
          <th>Patient</th>
          <th>Provider</th>
          <th>Date</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="5" class="empty-state">Set a date range and click Load Appointments.</td></tr>
      </tbody>
    </table>
  </div>

  <div class="actions-bar">
    <div class="actions-left" id="selectionInfo">0 selected</div>
    <div class="actions-right">
      <button class="btn btn-primary" id="eligBtn" type="button" disabled>Request Eligibility (0)</button>
      <button class="btn btn-success" id="histBtn" type="button" disabled>Request Med History (0)</button>
    </div>
  </div>
</div>

<script>
(function() {
  var BASE = "/plugin-io/api/surescripts_med_history/bulk";
  var appointments = [];
  var selected = new Set();

  // Init dates: today to +7 days
  var today = new Date();
  var nextWeek = new Date(today);
  nextWeek.setDate(nextWeek.getDate() + 7);
  document.getElementById("dateFrom").value = formatDate(today);
  document.getElementById("dateTo").value = formatDate(nextWeek);

  function formatDate(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var dd = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + dd;
  }

  // Multi-select provider combobox. Selected providers render as chips
  // inside the control. The hidden <input id="providerFilter"> stores the
  // current selection as a comma-separated list so other read sites
  // (loadBtn / sendBulk) get a single canonical string to forward.
  var providers = [];
  try {
    providers = JSON.parse(document.getElementById("providers-data").textContent || "[]");
  } catch(e) { providers = []; }

  var providerById = {};
  for (var pi = 0; pi < providers.length; pi++) {
    providerById[providers[pi].id] = providers[pi];
  }

  var comboRoot = document.getElementById("providerCombo");
  var comboControl = document.getElementById("providerControl");
  var comboSearch = document.getElementById("providerSearch");
  var comboHidden = document.getElementById("providerFilter");
  var comboList = document.getElementById("providerOptions");
  var comboClear = document.getElementById("providerClear");
  var selectedProviders = []; // ordered array of ids
  var activeIdx = -1;

  function isSelected(id) { return selectedProviders.indexOf(id) !== -1; }

  function syncHidden() {
    comboHidden.value = selectedProviders.join(",");
    comboRoot.classList.toggle("has-value", selectedProviders.length > 0);
    comboSearch.placeholder = selectedProviders.length
      ? "Add another provider"
      : "All providers — type to search";
  }

  function renderChips() {
    // Wipe existing chips but keep the search input in place
    var chips = comboControl.querySelectorAll(".combobox-chip");
    for (var i = 0; i < chips.length; i++) chips[i].remove();
    for (var j = 0; j < selectedProviders.length; j++) {
      var id = selectedProviders[j];
      var name = (providerById[id] && providerById[id].name) || id;
      var chip = document.createElement("span");
      chip.className = "combobox-chip";
      chip.dataset.id = id;
      chip.innerHTML = esc(name)
        + '<button type="button" data-remove="' + esc(id) + '" aria-label="Remove ' + esc(name) + '">×</button>';
      comboControl.insertBefore(chip, comboSearch);
    }
  }

  function filterProviders(q) {
    q = (q || "").trim().toLowerCase();
    var out = [];
    for (var i = 0; i < providers.length && out.length < 200; i++) {
      if (q && providers[i].name.toLowerCase().indexOf(q) === -1) continue;
      out.push(providers[i]);
    }
    return out;
  }

  function renderOptions(matches) {
    if (!matches.length) {
      comboList.innerHTML = '<li class="empty">No matching providers.</li>';
      activeIdx = -1;
      return;
    }
    var html = "";
    for (var i = 0; i < matches.length; i++) {
      var cls = "combobox-option" + (isSelected(matches[i].id) ? " selected" : "");
      html += '<li role="option" class="' + cls + '" data-id="' + esc(matches[i].id) + '">'
        + esc(matches[i].name) + '</li>';
    }
    comboList.innerHTML = html;
    activeIdx = -1;
  }

  function openCombo() {
    renderOptions(filterProviders(comboSearch.value));
    comboList.hidden = false;
  }
  function closeCombo() {
    comboList.hidden = true;
    activeIdx = -1;
  }

  function toggleProvider(id) {
    if (!id) return;
    var idx = selectedProviders.indexOf(id);
    if (idx === -1) selectedProviders.push(id);
    else selectedProviders.splice(idx, 1);
    renderChips();
    syncHidden();
    // Clear the search to make adding the next provider snappy and keep
    // the list visible so multiple picks don't require re-opening it.
    comboSearch.value = "";
    openCombo();
    comboSearch.focus();
  }

  function clearAll() {
    selectedProviders = [];
    renderChips();
    syncHidden();
    comboSearch.value = "";
    comboSearch.focus();
    closeCombo();
  }

  function setActive(idx) {
    var items = comboList.querySelectorAll("li[data-id]");
    if (!items.length) return;
    if (idx < 0) idx = items.length - 1;
    if (idx >= items.length) idx = 0;
    for (var i = 0; i < items.length; i++) items[i].classList.toggle("active", i === idx);
    activeIdx = idx;
    items[idx].scrollIntoView({ block: "nearest" });
  }

  // Click anywhere on the control area focuses the input
  comboControl.addEventListener("click", function(e) {
    if (e.target === comboControl) comboSearch.focus();
  });

  comboSearch.addEventListener("focus", openCombo);
  comboSearch.addEventListener("input", openCombo);
  comboSearch.addEventListener("keydown", function(e) {
    if (e.key === "Backspace" && !comboSearch.value && selectedProviders.length) {
      // Backspace on empty input pops the most recent chip
      selectedProviders.pop();
      renderChips();
      syncHidden();
      openCombo();
      e.preventDefault();
      return;
    }
    if (comboList.hidden) {
      if (e.key === "ArrowDown") { openCombo(); e.preventDefault(); }
      return;
    }
    if (e.key === "ArrowDown") { setActive(activeIdx + 1); e.preventDefault(); }
    else if (e.key === "ArrowUp") { setActive(activeIdx - 1); e.preventDefault(); }
    else if (e.key === "Enter") {
      var items = comboList.querySelectorAll("li[data-id]");
      if (activeIdx >= 0 && items[activeIdx]) {
        toggleProvider(items[activeIdx].dataset.id);
      }
      e.preventDefault();
    } else if (e.key === "Escape") {
      closeCombo();
    }
  });

  comboList.addEventListener("mousedown", function(e) {
    // mousedown beats input.blur so the click registers before the list closes
    var li = e.target.closest("li[data-id]");
    if (!li) return;
    toggleProvider(li.dataset.id);
    e.preventDefault();
  });

  // Chip removal via × button
  comboControl.addEventListener("click", function(e) {
    var btn = e.target.closest("button[data-remove]");
    if (!btn) return;
    toggleProvider(btn.dataset.remove);
    e.stopPropagation();
  });

  comboClear.addEventListener("click", clearAll);

  document.addEventListener("click", function(e) {
    if (!comboRoot.contains(e.target)) closeCombo();
  });

  // Init
  renderChips();
  syncHidden();

  function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

  function updateSelection() {
    var count = selected.size;
    document.getElementById("selectionInfo").textContent = count + " selected";
    document.getElementById("eligBtn").textContent = "Request Eligibility (" + count + ")";
    document.getElementById("eligBtn").disabled = count === 0;
    document.getElementById("histBtn").textContent = "Request Med History (" + count + ")";
    document.getElementById("histBtn").disabled = count === 0;
    document.getElementById("selectAll").checked = count > 0 && count === appointments.length;
  }

  function renderTable() {
    var tbody = document.getElementById("tableBody");
    if (!appointments.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No appointments found for this date range.</td></tr>';
      return;
    }
    var html = "";
    for (var i = 0; i < appointments.length; i++) {
      var a = appointments[i];
      var checked = selected.has(a.patient_id) ? " checked" : "";
      html += '<tr>'
        + '<td><input type="checkbox" data-pid="' + esc(a.patient_id) + '"' + checked + '></td>'
        + '<td>' + esc(a.patient_name) + '</td>'
        + '<td>' + esc(a.provider_name) + '</td>'
        + '<td>' + esc(a.appointment_date) + '</td>'
        + '<td>' + esc(a.appointment_time) + '</td>'
        + '</tr>';
    }
    tbody.innerHTML = html;
  }

  function showToast(type, msg) {
    var el = document.getElementById("toast");
    el.className = "toast " + type + " visible";
    el.textContent = msg;
    setTimeout(function() { el.classList.remove("visible"); }, 4000);
  }

  // Load
  document.getElementById("loadBtn").addEventListener("click", function() {
    var df = document.getElementById("dateFrom").value;
    var dt = document.getElementById("dateTo").value;
    var prov = document.getElementById("providerFilter").value;
    if (!df || !dt) { showToast("error", "Please select a date range."); return; }

    var tbody = document.getElementById("tableBody");
    tbody.innerHTML = '<tr><td colspan="5" class="loading-state">Loading appointments...</td></tr>';
    selected.clear();
    updateSelection();

    var url = BASE + "/appointments?date_from=" + df + "&date_to=" + dt;
    // provider hidden field is comma-separated ids; backend splits and uses __in
    if (prov) url += "&provider_ids=" + encodeURIComponent(prov);

    fetch(url, { credentials: "same-origin" })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        appointments = data.appointments || [];
        renderTable();
        if (appointments.length) {
          showToast("success", appointments.length + " patient" + (appointments.length !== 1 ? "s" : "") + " loaded.");
        }
      })
      .catch(function() {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Error loading appointments.</td></tr>';
        showToast("error", "Failed to load appointments.");
      });
  });

  // Checkbox delegation
  document.getElementById("tableBody").addEventListener("change", function(e) {
    if (e.target.type === "checkbox") {
      var pid = e.target.dataset.pid;
      if (e.target.checked) { selected.add(pid); } else { selected.delete(pid); }
      updateSelection();
    }
  });

  // Select all
  document.getElementById("selectAll").addEventListener("change", function() {
    var checked = this.checked;
    selected.clear();
    if (checked) {
      for (var i = 0; i < appointments.length; i++) {
        selected.add(appointments[i].patient_id);
      }
    }
    renderTable();
    updateSelection();
  });

  // Bulk actions
  function sendBulk(endpoint, btnId, label) {
    var btn = document.getElementById(btnId);
    var ids = Array.from(selected);
    if (!ids.length) return;

    btn.disabled = true;
    btn.textContent = "Sending...";

    fetch(BASE + "/" + endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({
        patient_ids: ids,
        date_from: document.getElementById("dateFrom").value,
        date_to: document.getElementById("dateTo").value,
        provider_ids: (document.getElementById("providerFilter").value || "")
          .split(",").filter(function(s) { return s; }),
      })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.status === "ok") {
        showToast("success", label + " sent for " + data.count + " patient" + (data.count !== 1 ? "s" : "") + ".");
      } else {
        showToast("error", data.error || "Request failed.");
      }
      updateSelection();
    })
    .catch(function() {
      showToast("error", "Request failed. Please try again.");
      updateSelection();
    });
  }

  document.getElementById("eligBtn").addEventListener("click", function() {
    sendBulk("eligibility", "eligBtn", "Eligibility requests");
  });
  document.getElementById("histBtn").addEventListener("click", function() {
    sendBulk("med-history", "histBtn", "Med history requests");
  });
})();
</script>

</body>
</html>
