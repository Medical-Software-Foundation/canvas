# This pyproject.toml is only used for local development and testing.
# The Canvas plugin has its own packaging process that doesn't use this file.

[project]
name = "canvas-theme-kit-demo"
version = "0.0.0"
description = "Reference consumer for Canvas Theme Kit. Renders a page whose first paint already carries the published design tokens, read at render time from the shared custom-data namespace."
authors = [
    { name = "Mike Sipes", email = "mike.sipes@invene.com" },
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=4.2.0",
    "canvas[test-utils]",
]

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-django>=4.7.0",
    "pytest-mock>=3.12.0",
]

[tool.coverage.run]
source = ["canvas_theme_kit_demo"]
omit = ["tests/*", "*/tests/*"]

[tool.coverage.report]
omit = ["tests/*", "*/tests/*"]
