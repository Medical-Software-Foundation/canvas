<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Failed faxes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ asset_base }}/styles.css?v={{ cache_bust }}">
</head>
<body data-base="{{ asset_base }}">
  <div class="wrap">
    <header class="top">
      <div>
        <h1>Failed faxes</h1>
        <p class="lede">Faxes that didn't make it, with what went wrong and a way to fix each one.</p>
      </div>
      <span class="window">Last 90 days</span>
    </header>

    <div class="tabs" role="tablist" aria-label="Fax direction">
      <button class="tab" role="tab" data-tab="sent" aria-selected="true">Sent <span class="count" id="count-sent">0</span></button>
      <button class="tab" role="tab" data-tab="received" aria-selected="false">Received <span class="count" id="count-received">0</span></button>
    </div>

    <p class="hint-line" id="hint-line"></p>
    <div class="filters" id="filters" role="search" aria-label="Filter failed faxes"></div>
    <p class="filter-count" id="filter-count" hidden></p>
    <div class="table-panel" id="table-panel" role="tabpanel"></div>
    <nav class="pager" id="pager" aria-label="Pages" hidden>
      <button class="btn" id="prev-page" type="button">Previous</button>
      <span id="page-label"></span>
      <button class="btn" id="next-page" type="button">Next</button>
    </nav>
  </div>

  <div class="scrim" id="scrim" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <h2 id="dialog-title"></h2>
        <p class="context" id="dialog-context"></p>
      </div>
      <div class="dialog-body" id="dialog-body"></div>
      <div class="dialog-foot">
        <p class="form-error" id="dialog-error" role="alert"></p>
        <button class="btn quiet" id="dialog-cancel" type="button">Cancel</button>
        <button class="btn primary" id="dialog-submit" type="button"></button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="{{ asset_base }}/app.js?v={{ cache_bust }}"></script>
</body>
</html>
