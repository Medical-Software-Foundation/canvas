<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Scheduling Waitlist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{{ asset_base }}/roster.css?v={{ cache_bust }}" />
</head>
<body>
  <div id="wl-app">
    <header class="wl-header">
      <div class="wl-header-title">
        <h1>Scheduling Waitlist</h1>
        <p class="wl-subtitle">Patients waiting to be scheduled, most urgent and longest waiting first</p>
      </div>
      <div class="wl-header-actions">
        <button type="button" id="wl-add" class="wl-btn wl-btn-primary">Add to waitlist</button>
      </div>
    </header>

    <form class="wl-filters" id="wl-filters" role="search" aria-label="Filter the waitlist">
      <div class="wl-field wl-field-search">
        <label for="wl-q">Search</label>
        <input type="search" id="wl-q" name="q" placeholder="Patient name" autocomplete="off" />
      </div>
      <div class="wl-field">
        <label for="wl-status">Status</label>
        <select id="wl-status" name="status"></select>
      </div>
      <div class="wl-field">
        <label for="wl-appointment-type">Service</label>
        <select id="wl-appointment-type" name="appointment_type_id"></select>
      </div>
      <div class="wl-field">
        <label for="wl-provider">Provider</label>
        <select id="wl-provider" name="provider_id"></select>
      </div>
      <div class="wl-field">
        <label for="wl-location">Location</label>
        <select id="wl-location" name="location_id"></select>
      </div>
      <div class="wl-field">
        <label for="wl-priority">Priority</label>
        <select id="wl-priority" name="priority"></select>
      </div>
      <div class="wl-field wl-field-actions">
        <button type="button" id="wl-reset" class="wl-btn wl-btn-quiet">Reset</button>
      </div>
    </form>

    <p class="wl-status" id="wl-status-line" aria-live="polite">Loading the waitlist&hellip;</p>

    <div class="wl-table-wrap">
      <table class="wl-table">
        <thead>
          <tr>
            <th scope="col">Patient</th>
            <th scope="col">Service</th>
            <th scope="col">Provider</th>
            <th scope="col">Location</th>
            <th scope="col">Priority</th>
            <th scope="col">Prefers</th>
            <th scope="col">Waiting</th>
            <th scope="col">Status</th>
            <th scope="col"><span class="wl-visually-hidden">Actions</span></th>
          </tr>
        </thead>
        <tbody id="wl-rows"></tbody>
      </table>
    </div>

    <div class="wl-pager" id="wl-pager" hidden>
      <button type="button" id="wl-prev" class="wl-btn wl-btn-quiet">Previous</button>
      <span id="wl-range"></span>
      <button type="button" id="wl-next" class="wl-btn wl-btn-quiet">Next</button>
    </div>
  </div>

  <dialog id="wl-edit-dialog" class="wl-dialog" aria-labelledby="wl-edit-title"></dialog>
  <dialog id="wl-add-dialog" class="wl-dialog" aria-labelledby="wl-add-title"></dialog>

  <div id="wl-toast" class="wl-toast" role="status" aria-live="polite" hidden></div>

  <script id="wl-config" type="application/json">{{ config_json }}</script>
  <script src="{{ asset_base }}/roster.js?v={{ cache_bust }}" defer></script>
</body>
</html>
