<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Scheduling waitlist">
  <!-- Queue of waiting entries, with a clock marking the wait. Kept to solid
       shapes and >=3px strokes so it stays legible at 48x48 in the provider menu. -->
  <rect width="48" height="48" rx="10" fill="#1f2933"/>

  <!-- Three queued entries -->
  <rect x="10" y="12" width="20" height="4" rx="2" fill="#ffffff"/>
  <rect x="10" y="22" width="15" height="4" rx="2" fill="#ffffff" opacity="0.75"/>
  <rect x="10" y="32" width="11" height="4" rx="2" fill="#ffffff" opacity="0.5"/>

  <!-- Clock: the wait -->
  <circle cx="34" cy="32" r="9" fill="#1f2933" stroke="#4fd1c5" stroke-width="3"/>
  <path d="M34 27.5V32l3 2.5" fill="none" stroke="#4fd1c5" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
