<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Canvas Event Webhooks</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1c2430;
      --muted: #5b6775;
      --border: #d7dee6;
      --accent: #0b6e4f;
      --accent-hover: #08563e;
      --danger: #b42318;
      --danger-bg: #fef3f2;
      --ok: #027a48;
      --ok-bg: #ecfdf3;
      --warn: #b54708;
      --warn-bg: #fffaeb;
      --focus: #0b6e4f;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 64px; }
    h1 { font-size: 1.5rem; margin: 0 0 6px; }
    .lede { color: var(--muted); margin: 0 0 24px; }
    .banner {
      border-radius: 8px;
      padding: 10px 14px;
      margin: 0 0 16px;
      font-size: 0.95rem;
    }
    .banner.error { background: var(--danger-bg); color: var(--danger); }
    .banner.ok { background: var(--ok-bg); color: var(--ok); }
    .banner.warn { background: var(--warn-bg); color: var(--warn); }
    .hidden { display: none !important; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 16px;
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .card-head h2 { font-size: 1.05rem; margin: 0; }
    .toggle { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
    .details-box {
      margin: 0 0 12px;
      padding: 10px 12px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .hint { color: var(--muted); font-size: 0.8rem; margin: 6px 0 0; }
    label.field { display: block; font-weight: 600; font-size: 0.85rem; margin: 12px 0 6px; }
    input[type="text"], input[type="url"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
    }
    input:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
    .secret-row { display: flex; gap: 8px; }
    .secret-row input { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85rem; }
    .btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { background: #f8fafc; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn.danger { color: var(--danger); border-color: #fecdca; background: var(--danger-bg); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .count { color: var(--muted); font-size: 0.9rem; margin: 8px 0 4px; }
    .events { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; max-height: 360px; overflow: auto; }
    .select-all { font-weight: 600; padding: 6px 0 10px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
    .cat { margin: 8px 0; }
    .cat-head { font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .cat-events { margin: 4px 0 8px 22px; display: grid; gap: 4px; }
    .check { display: flex; align-items: center; gap: 8px; font-weight: 400; }
    .footer-bar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-top: 8px; flex-wrap: wrap;
    }
    .muted { color: var(--muted); }
    .legacy { font-size: 0.85rem; background: var(--warn-bg); color: var(--warn); padding: 8px 10px; border-radius: 8px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Canvas Event Webhooks</h1>
    <p class="lede">Configure where Canvas events should be sent. You can set up to three independent destinations. Each destination only receives the events you select. Optionally include who did it, the patient name, and major record details.</p>
    <div id="flash" class="banner hidden" role="status"></div>
    <div id="cards"></div>
    <div class="footer-bar">
      <button type="button" class="btn primary" id="addBtn">+ Add Webhook</button>
      <span class="muted" id="quota"></span>
    </div>
  </div>
  <script>
    const API = new URL(".", window.location.href);
    let catalog = [];
    let webhooks = [];
    let drafts = [];
    let maxWebhooks = 3;

    const $ = (id) => document.getElementById(id);

    function flash(kind, message) {
      const el = $("flash");
      el.className = "banner " + kind;
      el.textContent = message;
      el.classList.remove("hidden");
    }
    function clearFlash() { $("flash").classList.add("hidden"); }

    async function api(path, options = {}) {
      const res = await fetch(new URL(path, API), {
        credentials: "same-origin",
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        ...options,
      });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = { error: text }; }
      if (!res.ok) throw new Error((data && data.error) || res.statusText);
      return data;
    }

    function allEventNames() {
      return catalog.flatMap((c) => c.events.map((e) => e.name));
    }

    function eventCount(selected) {
      const n = (selected || []).length;
      return n + " event" + (n === 1 ? "" : "s") + " selected";
    }

    function render() {
      const cards = $("cards");
      cards.innerHTML = "";
      const items = [...webhooks, ...drafts];
      items.forEach((wh, index) => cards.appendChild(renderCard(wh, index + 1)));
      const used = items.length;
      $("quota").textContent = used + " / " + maxWebhooks + " webhooks configured";
      $("addBtn").disabled = used >= maxWebhooks;
      $("addBtn").title = used >= maxWebhooks ? "Maximum of 3 webhooks configured." : "Add another webhook";
    }

    function renderCard(wh, n) {
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.id = wh.id || ("draft-" + n);

      const selected = new Set(wh.events || []);
      const allNames = allEventNames();

      const head = document.createElement("div");
      head.className = "card-head";
      head.innerHTML = `<h2>Webhook ${n}</h2>`;
      const toggle = document.createElement("label");
      toggle.className = "toggle";
      toggle.innerHTML = `<input type="checkbox" class="js-enabled" ${wh.enabled !== false ? "checked" : ""}> Enabled`;
      head.appendChild(toggle);
      card.appendChild(head);

      const detailsBox = document.createElement("div");
      detailsBox.className = "details-box";
      detailsBox.innerHTML = `
        <label class="toggle">
          <input type="checkbox" class="js-details" ${wh.include_details ? "checked" : ""}>
          Include names and details
        </label>
        <p class="hint">Adds a description, who performed the action, the patient name, and major record fields (time, status, title, provider).</p>
      `;
      card.appendChild(detailsBox);

      if (wh.legacy) {
        const note = document.createElement("div");
        note.className = "legacy";
        note.textContent = "This webhook comes from CLI secrets (webhook-url). Save it here to manage it in the UI. After saving, the UI configuration takes precedence.";
        card.appendChild(note);
      }

      card.insertAdjacentHTML("beforeend", `
        <label class="field">Name</label>
        <input type="text" class="js-name" maxlength="80" placeholder="Production API" value="${escapeAttr(wh.name || "")}">
        <label class="field">Webhook URL</label>
        <input type="url" class="js-url" placeholder="https://example.com/webhooks/canvas" value="${escapeAttr(wh.url || "")}">
        <label class="field">Webhook Secret</label>
        <div class="secret-row">
          <input type="text" class="js-secret" readonly value="${escapeAttr(wh.secret || (wh.id ? "" : "Generated automatically when you save"))}">
          <button type="button" class="btn js-copy" ${wh.secret ? "" : "disabled"}>Copy</button>
          <button type="button" class="btn js-regen" ${wh.id ? "" : "disabled"}>Regenerate</button>
        </div>
        <div class="count js-count">${eventCount([...selected])}</div>
        <label class="field">Events</label>
      `);

      const eventsBox = document.createElement("div");
      eventsBox.className = "events";

      const selectAll = document.createElement("label");
      selectAll.className = "select-all check";
      const selectAllCb = document.createElement("input");
      selectAllCb.type = "checkbox";
      selectAllCb.className = "js-select-all";
      selectAll.appendChild(selectAllCb);
      selectAll.appendChild(document.createTextNode(" Select All Events"));
      eventsBox.appendChild(selectAll);

      catalog.forEach((cat) => {
        const wrap = document.createElement("div");
        wrap.className = "cat";
        const headL = document.createElement("label");
        headL.className = "cat-head check";
        const catCb = document.createElement("input");
        catCb.type = "checkbox";
        catCb.className = "js-cat";
        catCb.dataset.key = cat.key;
        headL.appendChild(catCb);
        headL.appendChild(document.createTextNode(" " + cat.label));
        wrap.appendChild(headL);
        const list = document.createElement("div");
        list.className = "cat-events";
        cat.events.forEach((ev) => {
          const l = document.createElement("label");
          l.className = "check";
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.className = "js-event";
          cb.value = ev.name;
          cb.dataset.cat = cat.key;
          cb.checked = selected.has(ev.name);
          l.appendChild(cb);
          l.appendChild(document.createTextNode(" " + ev.label));
          list.appendChild(l);
        });
        wrap.appendChild(list);
        eventsBox.appendChild(wrap);
      });
      card.appendChild(eventsBox);

      const actions = document.createElement("div");
      actions.className = "actions";
      actions.innerHTML = `
        <button type="button" class="btn js-test" ${wh.id && wh.url ? "" : "disabled"}>Test Webhook</button>
        <button type="button" class="btn primary js-save">Save</button>
        <button type="button" class="btn danger js-delete">${wh.id && !String(wh.id).startsWith("draft") ? "Delete" : "Remove"}</button>
      `;
      card.appendChild(actions);

      function readSelected() {
        return [...card.querySelectorAll(".js-event:checked")].map((el) => el.value);
      }
      function syncChecks() {
        const sel = new Set(readSelected());
        card.querySelector(".js-count").textContent = eventCount([...sel]);
        const allCb = card.querySelector(".js-select-all");
        allCb.checked = allNames.length > 0 && allNames.every((n) => sel.has(n));
        allCb.indeterminate = !allCb.checked && allNames.some((n) => sel.has(n));
        card.querySelectorAll(".js-cat").forEach((catCb) => {
          const names = catalog.find((c) => c.key === catCb.dataset.key).events.map((e) => e.name);
          const nSel = names.filter((n) => sel.has(n)).length;
          catCb.checked = names.length > 0 && nSel === names.length;
          catCb.indeterminate = nSel > 0 && nSel < names.length;
        });
      }
      syncChecks();

      selectAllCb.addEventListener("change", () => {
        card.querySelectorAll(".js-event").forEach((cb) => { cb.checked = selectAllCb.checked; });
        syncChecks();
      });
      card.querySelectorAll(".js-cat").forEach((catCb) => {
        catCb.addEventListener("change", () => {
          card.querySelectorAll(`.js-event[data-cat="${catCb.dataset.key}"]`).forEach((cb) => {
            cb.checked = catCb.checked;
          });
          syncChecks();
        });
      });
      card.querySelectorAll(".js-event").forEach((cb) => cb.addEventListener("change", syncChecks));

      card.querySelector(".js-copy").addEventListener("click", async () => {
        const secret = card.querySelector(".js-secret").value;
        try {
          await navigator.clipboard.writeText(secret);
          flash("ok", "Secret copied.");
        } catch {
          flash("error", "Could not copy automatically. Select the secret and copy it manually.");
        }
      });

      card.querySelector(".js-regen").addEventListener("click", async () => {
        if (!confirm("Generate a new secret? Your receiver must be updated to the new value.")) return;
        try {
          const data = await api("webhooks/" + encodeURIComponent(wh.id) + "/regenerate", { method: "POST" });
          replaceWebhook(wh, data.webhook);
          flash("ok", "Secret regenerated.");
          render();
        } catch (err) { flash("error", err.message); }
      });

      card.querySelector(".js-save").addEventListener("click", async () => {
        clearFlash();
        const url = card.querySelector(".js-url").value.trim();
        if (url.toLowerCase().startsWith("http://")) {
          flash("error", "URL must use HTTPS. HTTP is not allowed.");
          return;
        }
        const payload = {
          name: card.querySelector(".js-name").value,
          url: url,
          events: readSelected(),
          enabled: card.querySelector(".js-enabled").checked,
          include_details: card.querySelector(".js-details").checked,
        };
        try {
          let data;
          if (!wh.id) {
            data = await api("webhooks", { method: "POST", body: JSON.stringify(payload) });
            drafts = drafts.filter((d) => d !== wh);
            webhooks.push(data.webhook);
          } else {
            data = await api("webhooks/" + encodeURIComponent(wh.id), { method: "PUT", body: JSON.stringify(payload) });
            replaceWebhook(wh, data.webhook);
          }
          flash(data.warning ? "warn" : "ok", data.warning || "Webhook saved.");
          render();
        } catch (err) { flash("error", err.message); }
      });

      card.querySelector(".js-delete").addEventListener("click", async () => {
        if (!confirm("Remove this webhook? It will stop receiving events.")) return;
        try {
          if (wh.id && !String(wh.id).startsWith("draft")) {
            await api("webhooks/" + encodeURIComponent(wh.id), { method: "DELETE" });
            webhooks = webhooks.filter((w) => w.id !== wh.id);
          } else {
            drafts = drafts.filter((d) => d !== wh);
          }
          flash("ok", "Webhook removed.");
          render();
        } catch (err) { flash("error", err.message); }
      });

      card.querySelector(".js-test").addEventListener("click", async () => {
        try {
          const data = await api("webhooks/" + encodeURIComponent(wh.id) + "/test", { method: "POST" });
          flash(data.warning ? "warn" : "ok", data.warning ? data.message + " " + data.warning : data.message);
        } catch (err) { flash("error", err.message); }
      });

      return card;
    }

    function replaceWebhook(oldWh, next) {
      const i = webhooks.findIndex((w) => w === oldWh || w.id === oldWh.id);
      if (i >= 0) webhooks[i] = next;
      else webhooks.push(next);
    }

    function escapeAttr(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    $("addBtn").addEventListener("click", () => {
      if (webhooks.length + drafts.length >= maxWebhooks) {
        flash("warn", "Maximum of 3 webhooks configured.");
        return;
      }
      drafts.push({ id: null, name: "", url: "", secret: "", enabled: true, include_details: false, events: [], draft: true });
      clearFlash();
      render();
    });

    (async function init() {
      try {
        const cat = await api("catalog");
        catalog = cat.categories || [];
        const list = await api("webhooks");
        webhooks = list.webhooks || [];
        maxWebhooks = list.max || 3;
        render();
      } catch (err) {
        flash("error", err.message || "Could not load webhook configuration.");
      }
    })();
  </script>
</body>
</html>
