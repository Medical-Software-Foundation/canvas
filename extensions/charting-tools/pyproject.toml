# This pyproject.toml is only used for local development and testing.
# The Canvas plugin has its own packaging process that doesn't use this file.

[project]
name = "charting-tools"
version = "0.17.3"
description = "Admin-built note templates that insert command sets from the note body slash menu."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "canvas[test-utils]>=0.254.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["charting_tools"]
omit = ["tests/*"]
