# This pyproject.toml is only used for local development and testing.
# The Canvas plugin has its own packaging process that doesn't use this file.

[project]
name = "patient-sex-banner"
version = "0.0.1"
description = "Displays a banner to let user know the patient sex is not male or female"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "canvas",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
pythonpath = [".."]
