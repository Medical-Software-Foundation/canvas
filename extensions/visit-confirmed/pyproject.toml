[project]
name = "visitconfirmed-canvas-medical"
version = "0.1.0"
description = "Visit Confirmed appointment-event connector for Canvas Medical"
# Canvas plugins run on the Canvas runtime, which is Python 3.11/3.12 — NOT the
# 3.14 the main Visit Confirmed Django app targets. Keep this pinned to the
# Canvas-supported range.
requires-python = ">=3.11,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "canvas[test-utils]",
    "pytest",
    # Canvas's REVIEW.md assumes `/wrap-up` has already passed mypy and >=90%
    # branch coverage, so both are needed before a catalog submission.
    "mypy",
    "pytest-cov",
]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["visit_confirmed"]
omit = ["tests/*"]
