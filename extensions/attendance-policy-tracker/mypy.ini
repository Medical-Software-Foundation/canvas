[mypy]
explicit_package_bases = True

check_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = False
disallow_untyped_defs = True
error_summary = True

show_error_context = True
strict_equality = True
strict_optional = True

warn_no_return = True
warn_redundant_casts = True
warn_return_any = True
warn_unreachable = True
warn_unused_configs = True
warn_unused_ignores = True

follow_imports = silent
ignore_missing_imports = True
no_implicit_optional = True
pretty = False

python_version = 3.12
exclude = debug

# The container wide invocation, uv run mypy --config-file=mypy.ini ., sweeps up
# tests alongside the shipped package. The section below is a deliberate choice to
# hold the tests module to a looser annotation bar than the shipped package, not a
# blanket ignore. It only turns off the requirement that test helpers carry
# annotations, disallow_untyped_defs and disallow_untyped_calls. check_untyped_defs
# stays on, so mypy still walks the body of an unannotated test helper and still
# catches a real type fault inside it. Every other option, including strict_equality,
# warn_unreachable, and warn_return_any, still applies to tests through the top level
# settings above, since a per module section only overrides the keys it lists. The
# shipped package under attendance_policy_tracker keeps full strictness, this section
# names only the tests module and nothing under the package.
[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
