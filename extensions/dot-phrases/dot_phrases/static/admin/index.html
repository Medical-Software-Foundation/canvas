<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dot Phrases</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="{{ api_base }}/admin/app.css?v={{ cache_bust }}">
</head>
<body data-api-base="{{ api_base }}">
  <section class="admin-app">
    <header class="ax-head">
      <div class="ax-title">Dot Phrases</div>
      <p class="ax-sub">Practice phrases everyone can use, practice settings, and bulk import. Only members of the plugin's admin team can open this.</p>
      <nav class="ax-tabs" id="axTabs" aria-label="Admin sections">
        <button class="on" data-t="phrases">Practice phrases</button><button data-t="settings">Practice settings</button>
      </nav>
    </header>
    <div class="ax-main" id="axMain"><p class="ax-sub">Loading…</p></div>
  </section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="{{ api_base }}/admin/app.js?v={{ cache_bust }}"></script>
</body>
</html>
