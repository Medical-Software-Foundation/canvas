[mypy]
explicit_package_bases = True

check_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = False
disallow_untyped_defs = True
error_summary = True

show_error_context = True
strict_equality = True
strict_optional = True

warn_no_return = True
warn_redundant_casts = True
warn_return_any = True
warn_unreachable = True
warn_unused_configs = True
warn_unused_ignores = True

follow_imports = silent
ignore_missing_imports = True
no_implicit_optional = True
pretty = False

python_version = 3.12
exclude = debug

# --- The three model files, and why var-annotated is disabled for them alone
#
# canvas_sdk ships no py.typed marker, verified absent in the installed
# package, so mypy resolves canvas_sdk.v1.data.base.CustomModel to Any,
# confirmed with reveal_type. A class whose base is Any is not recognised
# as a Django model, so django-stubs, which is installed transitively
# through canvas[test-utils] and is what makes Field generic in the first
# place, cannot parameterise any field declared on it. Every field then
# reads as a bare generic and mypy asks for an annotation.
#
# Enabling mypy_django_plugin was tried and changes nothing, for the same
# reason. The plugin only resolves fields on classes it recognises as
# models, and this one is Any to it.
#
# So the cause is upstream in the vendor SDK rather than in this plugin,
# and no annotation written here would fix it, it would only restate the
# type mypy already cannot check. Annotating would also break the byte for
# byte match between these files and Section 3 of SPEC.md, which is
# the whole reason that section is worth having.
#
# The suppression is therefore scoped as narrowly as it can be, one error
# code, three named modules. Everything else in these files is still
# checked, and the day canvas_sdk ships py.typed this block should be
# deleted and the errors should not come back.
#
# fax_label arrived in the second pass and nobody extended the list, so mypy
# failed on that file alone while the other two passed, which reads as a
# defect in the new model rather than as a list that was never added to.
[mypy-fax_queue_inboxes.models.fax_record]
disable_error_code = var-annotated

[mypy-fax_queue_inboxes.models.practice_label]
disable_error_code = var-annotated

[mypy-fax_queue_inboxes.models.fax_label]
disable_error_code = var-annotated
