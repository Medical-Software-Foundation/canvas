         label add does, and refreshLabelsEverywhere is the same reread
         addLabel already relies on so every other row's picker offers the
         new label the moment it next opens, with no page reload either
         place. */
      function createLabelAndApply(name, taskId, restore) {
        request("/labels", {
          method: "POST",
          body: JSON.stringify({ name: name })
        }).then(function (label) {
          return request("/tasks/" + encodeURIComponent(taskId) + "/label", {
            method: "POST",
            body: JSON.stringify({ label_id: label.id })
          });
        }).then(function (data) {
          patchTaskEverywhere(taskId, { labels: (data && data.labels) || [] });
          restore();
          return refreshLabelsEverywhere();
        }).catch(function () {
          restore();
          showPageError("Could not create the label. Try again in a moment.");
        });
      }

      /* Taking a label off is the chip's own X and needs no surface of its
         own, so this is a plain call rather than an editor. Removing a label
         the fax does not carry is not an error at the route either, so a chip
         dismissed twice needs no guard here. */
      function removeLabel(taskId, labelId) {
        if (!taskId || !labelId) {
          return;
        }
        request("/tasks/" + encodeURIComponent(taskId) + "/label/" + encodeURIComponent(labelId), {
          method: "DELETE"
        }).then(function (data) {
          patchTaskEverywhere(taskId, { labels: (data && data.labels) || [] });
        }).catch(function () {
          showPageError("Could not remove the label. Try again in a moment.");
        });
      }

      /* --- Assigning, in the row rather than over it ---

         The cell shows the assignee as a value until somebody clicks it, then
         this swaps a dropdown in where that value stood, already open, and puts
         the value back when nothing is chosen. It is the mechanic the home app's
         own task list uses on the same column, and it is why the cue no longer
         offers an undo, since changing the assignment again is the same one
         control rather than a second one on a banner. */
      function openAssignEditor(display, tab) {
        var taskId = display.getAttribute("data-task-id");
        return swapInEditor(
          display,
          "assign-editor",
          '<canvas-combobox size="sm" placeholder="Search people and teams" ' +
            'aria-label="Assign this fax" ' +
            'empty-state="No teams or staff to search yet">' +
            /* Clearing an assignment used to be a separate button on a popover
               and there is no popover now, so it is the first option in the
               same control. One place to set who owns a fax, including nobody. */
            '<canvas-option value="none">Unassigned</canvas-option>' +
            assigneeOptionsMarkup() +
            '</canvas-combobox>',
          function (combobox, restore) {
            if (!combobox.value) {
              return;
            }
            var clearing = combobox.value === "none";
            // Each option's own value carries which kind of assignee it names,
            // "team:" or "staff:" ahead of the id GET /assignees returned for it,
            // since the two kinds share one control per the approved proposal.
            var chosen = clearing ? null : parseAssigneeValue(combobox.value);
            if (!clearing && !chosen) {
              return;
            }
            /* Read before the write, because the row is about to leave this tab
               and the cue is the only thing that will say where it went. */
            var movingRow = findRow(tab, taskId);
            var movingTitle = movingRow && movingRow._task
              ? (movingRow._task.title || movingRow._task.type || "This fax")
              : "This fax";
            clearCue(tab);

            var call = clearing
              ? request("/tasks/" + encodeURIComponent(taskId) + "/assign", { method: "DELETE" })
              : request("/tasks/" + encodeURIComponent(taskId) + "/assign", {
                  method: "POST",
                  body: JSON.stringify(
                    chosen.kind === "team" ? { team_id: chosen.id } : { staff_id: chosen.id }
                  )
                });

            call.then(function (data) {
              /* No optimistic patch here, unlike the labels. _assignee_name
                 prefers a committed IntegrationTaskReview over the plugin's own
                 record, so what this route just wrote is not necessarily what
                 the row will report, and patching from it could flash a name
                 the next read corrects. An assignment also moves a fax between
                 tabs and changes the counts, and api.py owns that decision. So
                 every tab is read again quietly, which reconciles without a
                 loader and leaves the scroll position alone. */
              var name = (data && (data.assigned_staff || data.assigned_team)) || null;
              return refreshEveryTab().then(function () {
                restore();
                announceMove(tab, taskId, movingTitle,
                  clearing ? "Assignment cleared" : (name ? "Assigned to " + name : "Assigned"));
              });
            }).catch(function () {
              restore();
              showPageError(clearing
                ? "Could not clear the assignment. Try again in a moment."
                : "Could not assign this fax. Try again in a moment.");
            });
          }
        );
      }

      /* --- Behaviour step 23, the Manage labels modal ---

         Restores the surface spec version 2 withdrew for a presentation
         reason rather than a scope one, per the change request. The three
         routes underneath were already built and tested, so this is the one
         page that finally calls them, plus the count GET /labels now carries
         so a deletion can say what it costs before it happens. */

      function showModalError(message) {
        var region = document.getElementById("labels-modal-error");
        region.innerHTML =
          '<canvas-banner variant="error" header="' + escapeHtml(message) + '"></canvas-banner>';
      }

      function clearModalError() {
        document.getElementById("labels-modal-error").innerHTML = "";
      }

      /* A label row's read state, read by the first paint of the modal table
         and by every repaint after an add, a rename or a delete, so the
         three paths cannot drift into building a row two different ways.
         The name renders as plain text rather than as a field, per
         Behaviour step 27, and Edit is what turns it into one. The two
         controls share the class the shared minimum width rule already
         reads, so a read state row lines up with the add row above the
         same way the row's other two states do. */
      function labelReadRowMarkup(label) {
        var id = escapeHtml(label.id);
        var name = escapeHtml(label.name);
        return '<canvas-table-row data-label-id="' + id + '">' +
          '<canvas-table-cell>' +
          '<span class="label-name-text">' + name + '</span>' +
          '</canvas-table-cell>' +
          '<canvas-table-cell actions>' +
          '<div class="label-row-actions">' +
          '<canvas-button variant="ghost" class="label-edit-button" ' +
          'data-label-id="' + id + '">Edit</canvas-button>' +
          '<canvas-button variant="ghost" class="label-delete-button" ' +
          'data-label-id="' + id + '" data-label-name="' + name + '" ' +
          'data-fax-count="' + escapeHtml(label.fax_count) + '">Delete</canvas-button>' +
          '</div>' +
          '</canvas-table-cell>' +
          '</canvas-table-row>';
      }

      /* The two cells a row swaps to on Edit, per Behaviour step 27. The
         input carries the stored name rather than an empty one, since Save
         commits whatever is in it and Cancel is what throws it away, and a
         plain canvas-input runs roughly forty three pixels tall, which is
         why its two buttons keep the base size the add row already uses
         rather than the shorter size a table's own action buttons usually
         take, so Cancel and Save line up with Add label as the same box
         rather than a table sized button beside a form sized one. */
      function labelEditCellsMarkup(label) {
        var id = escapeHtml(label.id);
        var name = escapeHtml(label.name);
        return '<canvas-table-cell>' +
          '<canvas-input class="label-name-input" data-label-id="' + id + '" ' +
          'aria-label="Label name" value="' + name + '"></canvas-input>' +
          '</canvas-table-cell>' +
          '<canvas-table-cell actions>' +
          '<div class="label-row-actions">' +
          '<canvas-button variant="ghost" class="label-cancel-button" ' +
          'data-label-id="' + id + '">Cancel</canvas-button>' +
          '<canvas-button variant="secondary" class="label-save-button" ' +
          'data-label-id="' + id + '">Save</canvas-button>' +
          '</div>' +
          '</canvas-table-cell>';
      }

      /* The sentence a row's delete state names, per Behaviour step 27 and
         the change request's own third sketch. The count travels on the
         button that asked for this state as data-fax-count, read straight
         off GET /labels rather than asked for again, so entering the state
         costs nothing beyond what painting the read row already paid for.
         Deliberately singular or plural rather than the sketch's own bare
         plural, since a label carried by exactly one fax reading as one
         faxes would be wrong on the one row where the number is smallest
         and easiest to notice. */
      function deleteRowPhrase(name, faxCount) {
        var count = parseInt(faxCount, 10) || 0;
        var noun = count === 1 ? "fax" : "faxes";
        return 'Delete "' + name + '", carried by ' + count + ' ' + noun;
      }

      /* The two cells a row swaps to on Delete, per Behaviour step 27. No
         second modal opens over the manage labels modal for this, the row
         itself becomes the confirmation, which is what the change request
         settled and what makes Delete here a danger button rather than the
         ghost one the read state carries, since a row already asking to
         confirm is the confirmation the design system otherwise wants
         standing between a person and a danger button. */
      function labelDeleteCellsMarkup(labelId, name, faxCount) {
        var id = escapeHtml(labelId);
        return '<canvas-table-cell>' +
          '<span class="label-name-text">' + escapeHtml(deleteRowPhrase(name, faxCount)) + '</span>' +
          '</canvas-table-cell>' +
          '<canvas-table-cell actions>' +
          '<div class="label-row-actions">' +
          '<canvas-button variant="ghost" class="label-cancel-button" ' +
          'data-label-id="' + id + '">Cancel</canvas-button>' +
          '<canvas-button variant="danger" class="label-confirm-delete-button" ' +
          'data-label-id="' + id + '">Delete</canvas-button>' +
          '</div>' +
          '</canvas-table-cell>';
      }

      function findLabelRow(labelId) {
        return document.querySelector(
          'canvas-table-row[data-label-id="' + labelId + '"]'
        );
      }

      /* labelsCache already arrives in name order from GET /labels, so this
         sort costs nothing on the ordinary path and is what keeps the table
         in order regardless, since the cache is patched in place by
         fetchLabels rather than reread by this function. Every row this
         paints is in its read state, which is also how Behaviour step 27's
         one row at a time rule is kept, entering the edit or the delete
         state always starts from this full repaint rather than from
         whatever a row happened to be showing before, so there is never a
         second state left over from an earlier click to track by hand. */
      function renderLabelsModalTable() {
        var body = document.getElementById("labels-table-body");
        var ordered = labelsCache.slice().sort(function (a, b) {
          return a.name.localeCompare(b.name);
        });
        body.innerHTML = ordered.map(labelReadRowMarkup).join("");
        wireLabelsModalRows(body);
      }

      function wireLabelsModalRows(root) {
        root.querySelectorAll(".label-edit-button").forEach(function (button) {
          button.addEventListener("click", function () {
            enterLabelEditState(button.getAttribute("data-label-id"));
          });
        });
        root.querySelectorAll(".label-delete-button").forEach(function (button) {
          button.addEventListener("click", function () {
            enterLabelDeleteState(
              button.getAttribute("data-label-id"),
              button.getAttribute("data-label-name"),
              button.getAttribute("data-fax-count")
            );
          });
        });
      }

      /* Every row returns to its read state first, per Behaviour step 27's
         one row at a time rule, and the full repaint renderLabelsModalTable
         already does is what proves that rather than a second place
         tracking which row was left open. The row this call is about then
         has its own two cells swapped for the editor, keeping the same
         canvas-table-row element and its data-label-id rather than
         rebuilding the row itself. */
      function enterLabelEditState(labelId) {
        renderLabelsModalTable();
        var label = labelsCache.find(function (entry) {
          return String(entry.id) === String(labelId);
        });
        var row = findLabelRow(labelId);
        if (!label || !row) {
          return;
        }
        row.innerHTML = labelEditCellsMarkup(label);
        wireLabelEditRow(row);
      }

      function wireLabelEditRow(row) {
        var input = row.querySelector(".label-name-input");
        row.querySelector(".label-cancel-button").addEventListener("click", function () {
          // Cancel writes nothing and the stored name is what the next
          // repaint reads, so returning to the read state is the whole of
          // restoring it.
          renderLabelsModalTable();
        });
        row.querySelector(".label-save-button").addEventListener("click", function () {
          renameLabel(row.getAttribute("data-label-id"), input, input.value);
        });
      }

      /* The mirror of enterLabelEditState for Delete, per Behaviour step 27.
         The name and the count travel as arguments rather than a second
         cache read, since the button that asked for this state already
         carried both on its own data attributes. */
      function enterLabelDeleteState(labelId, name, faxCount) {
        renderLabelsModalTable();
        var row = findLabelRow(labelId);
        if (!row) {
          return;
        }
        row.innerHTML = labelDeleteCellsMarkup(labelId, name, faxCount);
        wireLabelDeleteRow(row);
      }

      function wireLabelDeleteRow(row) {
        row.querySelector(".label-cancel-button").addEventListener("click", function () {
          renderLabelsModalTable();
        });
        row.querySelector(".label-confirm-delete-button").addEventListener("click", function () {
          deleteLabelRow(row.getAttribute("data-label-id"));
        });
      }

      /* The one place a change inside the modal turns into what the rest of
         the page shows. labelsCache is what the row level pickers read, so it
         is refetched here, and refreshEveryTab is the existing quiet reread
         the assignment editor already relies on for the same reason, a fax
         label can be renamed or removed on any of the three tabs at once and
         only the server knows which rows those are. */
      function refreshLabelsEverywhere() {
        return fetchLabels().then(function () {
          renderLabelsModalTable();
          return refreshEveryTab();
        });
      }

      function openLabelsModal() {
        clearModalError();
        renderLabelsModalTable();
        document.getElementById("labels-modal").open();
      }

      function addLabel() {
        var input = document.getElementById("new-label-input");
        var name = input.value.trim();
        clearModalError();
        request("/labels", { method: "POST", body: JSON.stringify({ name: name }) })
          .then(function () {
            input.value = "";
            return refreshLabelsEverywhere();
          })
          .catch(function () {
            showModalError("Could not add the label. Try again in a moment.");
          });
      }

      /* Driven by Save now rather than by an input's own change event,
         since the row no longer carries a field at rest for that event to
         fire from. A failure leaves the input on screen with the error
         attribute set rather than returning to the read state, so the
         stored name a Cancel would restore is never confused with a name
         that failed to commit. */
      function renameLabel(labelId, input, name) {
        var trimmed = name.trim();
        if (!trimmed) {
          input.setAttribute("error", "A label name is required");
          return;
        }
        input.removeAttribute("error");
        request("/labels/" + encodeURIComponent(labelId), {
          method: "PUT",
          body: JSON.stringify({ name: trimmed })
        }).then(function () {
          return refreshLabelsEverywhere();
        }).catch(function () {
          input.setAttribute("error", "Could not rename this label. Try again in a moment.");
        });
      }

      /* Behaviour step 27's Delete commit. A failure returns the row to its
         read state rather than leaving the delete confirmation standing,
         since nothing about a failed request needs the row held open the
         way a failed rename needs the input held open, there is no second
         value waiting to be retried against the same field. */
      function deleteLabelRow(labelId) {
        request("/labels/" + encodeURIComponent(labelId), { method: "DELETE" })
          .then(function () {
            return refreshLabelsEverywhere();
          })
          .catch(function () {
            renderLabelsModalTable();
            showModalError("Could not delete the label. Try again in a moment.");
          });
      }

      document.addEventListener("DOMContentLoaded", function () {
        /* Changing tab dismisses any cue. canvas-tabs raises tab-change from
           its own activation path, so this catches a tab clicked by a person
           and one switched by Show me alike. */
        var tabsEl = document.querySelector("canvas-tabs");
        if (tabsEl) {
          tabsEl.addEventListener("tab-change", clearEveryCue);
        }

        document.getElementById("manage-labels-button").addEventListener("click", openLabelsModal);
        document.getElementById("add-label-button").addEventListener("click", addLabel);

        clearPageError();
        fetchLabels();
        fetchAssignees();
        loadTab("unassigned");
        loadTab("my-team");
        loadTab("all");
      });
    })();
  </script>
</body>
</html>
