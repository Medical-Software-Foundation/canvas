<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schedule — Big Leap Health</title>
  <link rel="stylesheet" href="styles.css?v={{ cache_bust }}">
  {{ theme_style|safe }}
</head>
<body>
  <div id="app">

    <!-- Top toolbar -->
    <header class="toolbar">
      <div class="toolbar-date-nav">
        <button id="btn-prev" class="btn-icon-nav" title="Previous day" aria-label="Previous day">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M10.5 3L5.5 8l5 5"/></svg>
        </button>
        <div class="date-display-wrap">
          <input type="date" id="date-picker" class="date-input" aria-label="Select date" />
          <span id="date-display" class="date-display-text"></span>
        </div>
        <button id="btn-next" class="btn-icon-nav" title="Next day" aria-label="Next day">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M5.5 3l5 5-5 5"/></svg>
        </button>
        <button id="btn-today" class="btn-today">Today</button>
      </div>

      <!-- Day / Week / Month view toggle -->
      <div class="toolbar-view-toggle">
        <button id="btn-view-day" class="btn-view active" aria-pressed="true">Day</button>
        <button id="btn-view-week" class="btn-view" aria-pressed="false">Week</button>
        <button id="btn-view-month" class="btn-view" aria-pressed="false">Month</button>
      </div>

      <div class="toolbar-view-toggle" id="schedule-type-toggle">
        <button id="btn-type-all" class="btn-view active" aria-pressed="true">All</button>
        <button id="btn-type-providers" class="btn-view" aria-pressed="false">Providers</button>
        <button id="btn-type-rooms" class="btn-view" aria-pressed="false">Rooms</button>
        <button id="btn-type-locations" class="btn-view" aria-pressed="false">Locations</button>
      </div>

      <div class="toolbar-filters">
        <div class="multiselect" id="ms-provider">
          <button class="multiselect-btn" type="button" aria-label="Filter by provider">
            <svg class="filter-icon" width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm5 5H3a5 5 0 0 1 10 0z"/>
            </svg>
            <span class="multiselect-label">All Providers and Rooms</span>
            <svg class="multiselect-caret" width="10" height="10" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
          </button>
          <div class="multiselect-panel hidden"></div>
        </div>

        <div class="multiselect" id="ms-location">
          <button class="multiselect-btn" type="button" aria-label="Filter by location">
            <svg class="filter-icon" width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M8 1a5 5 0 0 0-5 5c0 4 5 9 5 9s5-5 5-9a5 5 0 0 0-5-5zm0 7a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/>
            </svg>
            <span class="multiselect-label">All Locations</span>
            <svg class="multiselect-caret" width="10" height="10" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
          </button>
          <div class="multiselect-panel hidden"></div>
        </div>

        <button id="btn-refresh" class="btn-refresh" title="Refresh" aria-label="Refresh appointments">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
            <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
          </svg>
        </button>
      </div>

      {% if staff_name %}
      <div class="toolbar-user">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.029 10 8 10c-2.03 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z"/>
        </svg>
        <span class="toolbar-user-name">{{ staff_name }}</span>
      </div>
      {% endif %}
    </header>

    <!-- Summary stats bar -->
    <div class="stats-bar" id="stats-bar" aria-live="polite">
      <span id="stats-text" class="stats-text"></span>
    </div>

    <!-- Error/info banner -->
    <div id="status-bar" class="status-bar hidden" role="alert"></div>

    <!-- Main schedule area -->
    <main id="schedule-main" class="schedule-main">

      <!-- Loading state -->
      <div id="loading-state" class="loading-state" aria-live="polite">
        <div class="spinner" role="status" aria-label="Loading"></div>
        <span>Loading appointments&hellip;</span>
      </div>

      <!-- Empty state -->
      <div id="empty-state" class="empty-state hidden" aria-live="polite">
        <svg class="empty-icon" width="48" height="48" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="10" y="20" width="80" height="70" rx="8" fill="none" stroke="#c8c8c8" stroke-width="4"/>
          <rect x="10" y="20" width="80" height="22" rx="8" fill="#e0e0e0"/>
          <rect x="10" y="34" width="80" height="8" fill="#e0e0e0"/>
          <rect x="28" y="12" width="8" height="18" rx="4" fill="#bdbdbd"/>
          <rect x="64" y="12" width="8" height="18" rx="4" fill="#bdbdbd"/>
          <line x1="25" y1="65" x2="75" y2="65" stroke="#e0e0e0" stroke-width="3" stroke-linecap="round"/>
          <line x1="25" y1="78" x2="55" y2="78" stroke="#e0e0e0" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <h3 class="empty-title">No appointments</h3>
        <p class="empty-body">No appointments found for this date with the current filters.</p>
      </div>

      <!-- Appointment grid (day view) -->
      <div id="schedule-grid" class="schedule-grid hidden">

        <!-- Column header row (generated by JS when grouped by provider) -->
        <div id="provider-columns-header" class="provider-columns-header hidden"></div>

        <!-- Appointments table -->
        <div id="appointments-table" class="appointments-table"></div>

      </div>

      <!-- Week view -->
      <div id="week-view" class="hidden">
        <div class="week-grid-header" id="week-grid-header"></div>
        <div class="week-grid-body" id="week-grid-body"></div>
      </div>

      <!-- Month calendar view -->
      <div id="month-view" class="hidden">
        <div class="month-grid-header" id="month-grid-header"></div>
        <div class="month-grid-body" id="month-grid-body"></div>
      </div>

    </main>

    <!-- Appointment detail modal (built by JS) -->
    <div id="appt-modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="Appointment details"></div>

  </div>

  <script>
    window.__BLH_CONFIG = {
      gridStartHour: {{ grid_start_hour }},
      gridEndHour: {{ grid_end_hour }}
    };
  </script>
  <script src="app.js?v={{ cache_bust }}"></script>
</body>
</html>
